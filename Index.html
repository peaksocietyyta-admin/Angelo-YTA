<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelo — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #161616;
    --border: #2a2a2a;
    --muted: #3a3a3a;
    --dim: #888;
    --white: #f5f5f5;
    --accent: #ffffff;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  /* Top label */
  .label {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
  }

  /* Name */
  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 12vw, 96px);
    letter-spacing: 0.04em;
    line-height: 0.9;
    text-align: center;
    color: var(--accent);
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.2s;
  }

  .name span {
    display: block;
    color: #444;
  }

  /* Tagline */
  .tagline {
    font-size: 13px;
    font-weight: 300;
    color: var(--dim);
    letter-spacing: 0.05em;
    text-align: center;
    margin-top: 16px;
    max-width: 280px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.35s;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 32px 0;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.45s;
  }

  /* Links */
  .links {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: var(--card);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--white);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, background 0.2s;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .link-item:nth-child(1) { animation-delay: 0.55s; }
  .link-item:nth-child(2) { animation-delay: 0.65s; }
  .link-item:nth-child(3) { animation-delay: 0.75s; }
  .link-item:nth-child(4) { animation-delay: 0.85s; }

  .link-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: rgba(255,255,255,0.04);
    transition: width 0.3s ease;
  }

  .link-item:hover {
    border-color: #555;
    background: #1c1c1c;
  }

  .link-item:hover::before {
    width: 100%;
  }

  .link-item:active {
    background: #222;
    transform: scale(0.99);
  }

  .icon-wrap {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s;
  }

  .link-item:hover .icon-wrap {
    border-color: #555;
  }

  .icon-wrap svg {
    width: 16px;
    height: 16px;
    fill: var(--white);
  }

  .link-text {
    flex: 1;
  }

  .link-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.08em;
    line-height: 1;
  }

  .link-sub {
    font-size: 10px;
    font-weight: 400;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .arrow {
    color: var(--muted);
    font-size: 14px;
    transition: color 0.2s, transform 0.2s;
  }

  .link-item:hover .arrow {
    color: var(--white);
    transform: translateX(3px);
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #333;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 1s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
